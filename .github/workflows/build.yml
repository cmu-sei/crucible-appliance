name: build

on:
  push:
    branches:
      - dev
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ova_sha256: ${{ steps.integrity_check.outputs.sha256 }}
      ova_url: ${{ steps.log_ova_url.outputs.url }}

    steps:
      - uses: actions/checkout@v6

      - name: Packer cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/packer
          key: ${{ runner.os }}-packer

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet qemu-system-x86 qemu-utils

      - name: Initialize Packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init crucible-appliance.pkr.hcl

      - name: Build QEMU image
        env:
          GITHUB_PULL_REQUEST: ${{ github.event.number }}
          PACKER_LOG: 1
          PACKER_LOG_PATH: qemu-logs/packer.log
        run: |
          mkdir -p qemu-logs
          sudo -E ./build-appliance.sh qemu -force
          sudo chown -R $USER: ./output-qemu ./qemu-logs

      - name: Print QEMU logs
        if: always()
        run: |
          for log in qemu-logs/*; do
            echo "::group::$(basename "$log")"
            cat "$log" 2>/dev/null || echo "(empty)"
            echo "::endgroup::"
          done

      - name: Convert to OVA
        run: |
          build_name=$(basename output-qemu/crucible-appliance-*)
          echo "build_name=$build_name" >> $GITHUB_ENV
          mkdir -p output-ova

          # Convert qcow2 to stream-optimized VMDK
          qemu-img convert -f qcow2 -O vmdk -o subformat=streamOptimized \
            output-qemu/${build_name} output-ova/${build_name}-disk001.vmdk

          # Generate OVF from template
          disk_file="${build_name}-disk001.vmdk"
          disk_size=$(stat --format=%s "output-ova/$disk_file")
          disk_capacity=$(grep 'disk_size_virtualbox' crucible-appliance.pkr.hcl | grep -o '[0-9]*')
          disk_capacity_gb=$(( disk_capacity / 1000 ))
          memory_mb=$(grep -E '^\s*memory\s*=' crucible-appliance.pkr.hcl | grep -o '[0-9]*')
          cpu_count=$(grep -E '^\s*cpus\s*=' crucible-appliance.pkr.hcl | grep -o '[0-9]*')
          sed -e "s/{{VM_NAME}}/${build_name}/g" \
              -e "s/{{DISK_FILENAME}}/${disk_file}/g" \
              -e "s/{{DISK_SIZE}}/${disk_size}/g" \
              -e "s/{{DISK_CAPACITY}}/${disk_capacity_gb}/g" \
              -e "s/{{MEMORY_MB}}/${memory_mb}/g" \
              -e "s/{{CPU_COUNT}}/${cpu_count}/g" \
              appliance.ovf.template > output-ova/${build_name}.ovf

          # Create manifest and package OVA
          cd output-ova
          openssl sha256 *.ovf *.vmdk > ${build_name}.mf
          tar -cvf ../${build_name}.ova --format=ustar ${build_name}{.ovf,-disk001.vmdk,.mf}

      - name: OVA Integrity Check
        id: integrity_check
        run: |
          sha256=$(sha256sum ${{ env.build_name }}.ova | awk '{print $1}')
          echo "sha256=$sha256" >> $GITHUB_OUTPUT
          echo "SHA256: $sha256  ${{ env.build_name }}.ova"

      - name: Upload OVA to Azure Storage
        run: |
          az cloud set --name AzureUSGovernment
          az storage blob upload --file ${{ env.build_name }}.ova \
                                 --container-name ova \
                                 --name crucible-appliance/${{ env.build_name }}.ova \
                                 --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                                 --no-progress

      - name: Log OVA URL
        id: log_ova_url
        run: |
          URL=$(az storage blob url \
            --container-name ova \
            --name crucible-appliance/${{ env.build_name }}.ova \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            -o tsv)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "OVA uploaded to: $URL"

          {
            echo "### :package: Appliance image uploaded"
            echo ""
            echo "\`${URL}\`"
            echo ""
            echo "**SHA256:** \`${{ steps.integrity_check.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
